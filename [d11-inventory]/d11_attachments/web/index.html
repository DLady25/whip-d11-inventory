<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Tokens do tema D12 (whip_theme_d12); style.css tem os mesmos valores de reserva se o tema estiver desligado. -->
<link rel="stylesheet" href="https://cfx-nui-whip_theme_d12/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root" class="hidden">
    <div id="header">
        <div id="title"></div>
        <div id="label"></div>
        <div id="hint"></div>
    </div>
    <button id="camera" type="button"></button>
    <aside id="card" class="hidden">
        <div class="card-top">
            <div class="card-img"><img id="card-img" alt=""></div>
            <div class="card-head">
                <div id="card-kind" class="card-kind"></div>
                <div id="card-name" class="card-name"></div>
            </div>
        </div>
        <p id="card-desc" class="card-desc"></p>
        <div id="card-rows" class="card-rows"></div>
        <div class="card-sec">Acessórios</div>
        <div id="card-parts" class="card-parts"></div>
    </aside>
    <div id="points"></div>
</div>
<script src="app.js"></script>
</body>
</html>
